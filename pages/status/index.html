<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hearthlight 状态</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <section id="life-state" class="panel">
        <h2 data-i18n="status.life_state.title">生活状态</h2>
        <div id="life-state-content" class="content" data-i18n="status.loading">加载中…</div>
      </section>
      <section id="relationships" class="panel">
        <h2 data-i18n="status.relationships.title">关系</h2>
        <div id="relationships-content" class="content" data-i18n="status.loading">加载中…</div>
      </section>
      <section id="person-keys" class="panel">
        <h2 data-i18n="status.person.title">人物 / 合并</h2>
        <div id="person-keys-content" class="content" data-i18n="status.loading">加载中…</div>
        <div id="person-keys-feedback" class="feedback" hidden></div>
        <div class="person-actions">
          <button type="button" id="person-rollback-btn" class="btn" data-i18n="status.person.rollback">回滚上次合并</button>
        </div>
      </section>
      <section id="emotion-state" class="panel">
        <h2 data-i18n="status.emotion.title">情绪与表达</h2>
        <div id="emotion-content" class="content" data-i18n="status.loading">加载中…</div>
      </section>
      <section id="group-state" class="panel">
        <h2 data-i18n="status.group.title">群聊</h2>
        <div id="group-state-content" class="content" data-i18n="status.loading">加载中…</div>
      </section>
      <section id="growth-state" class="panel">
        <h2 data-i18n="status.growth.title">成长</h2>
        <div id="growth-state-content" class="content" data-i18n="status.loading">加载中…</div>
      </section>
      <section id="motivation-log" class="panel">
        <h2 data-i18n="status.motivation.title">主动消息记录</h2>
        <div id="motivation-content" class="content" data-i18n="status.loading">加载中…</div>
      </section>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
